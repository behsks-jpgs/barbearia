<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="barra" class="barra">
    <a th:href="@{/}" class="marca">
        <a th:href="@{/}" class="marca">
    <span class="marca-nome" th:text="${@tema.nomeBarbearia}">Barbearia</span>
    <nav class="menu" aria-label="Navegação principal">
        <a th:href="@{/}">Início</a>
        <a sec:authorize="hasAnyRole('CLIENTE','ADMIN')" th:href="@{/cliente}">Meu painel</a>
        <a sec:authorize="hasAnyRole('BARBEIRO','ADMIN')" th:href="@{/barbeiro}">Agenda</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Usuários</a>
    </nav>

    <div class="sessao">
        <th:block sec:authorize="isAnonymous()">
            <a th:href="@{/login}" class="botao botao-fantasma">Entrar</a>
            <a th:href="@{/cadastro}" class="botao">Criar conta</a>
        </th:block>
        <th:block sec:authorize="isAuthenticated()">
            <span class="sessao-usuario" sec:authentication="name">usuario@email.com</span>
            <form th:action="@{/logout}" method="post" class="sessao-sair">
                <button type="submit" class="botao botao-fantasma">Sair</button>
            </form>
        </th:block>
    </div>
</header>
</body>
</html>
