<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${@tema.layout}}">
<head>
    <title>Entrar</title>
</head>
<body>
<section layout:fragment="conteudo" class="painel-estreito">
    <div class="cartao cartao-formulario">
        <h1>Entrar</h1>
        <p class="texto-suave">Use o e-mail e a senha cadastrados.</p>

        <p th:if="${param.erro}" class="alerta alerta-erro" role="alert">E-mail ou senha inválidos.</p>
        <p th:if="${param.saiu}" class="alerta alerta-sucesso" role="status">Você saiu da sua conta.</p>

        <form th:action="@{/login}" method="post" class="formulario" novalidate>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="username" required autofocus>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>

            <button type="submit" class="botao botao-bloco">Entrar</button>
        </form>

        <p class="rodape-formulario">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
    </div>
</section>
</body>
</html>
