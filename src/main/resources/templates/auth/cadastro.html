<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{${@tema.layout}}">
<head>
    <title>Criar conta</title>
</head>
<body>
<section layout:fragment="conteudo" class="painel-estreito">
    <div class="cartao cartao-formulario">
        <h1>Criar conta</h1>
        <p class="texto-suave">Novas contas entram com o perfil de cliente.</p>

        <form th:action="@{/cadastro}" th:object="${form}" method="post" class="formulario" novalidate>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" th:field="*{nome}" autocomplete="name" maxlength="80" required
                   th:errorclass="campo-invalido">
            <small class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>

            <label for="email">E-mail</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email" maxlength="120" required
                   th:errorclass="campo-invalido">
            <small class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" th:field="*{telefone}" autocomplete="tel" placeholder="(11) 91234-5678"
                   required th:errorclass="campo-invalido">
            <small class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></small>

            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}" autocomplete="new-password" maxlength="64"
                   required th:errorclass="campo-invalido">
            <small class="dica-campo">Mínimo de 8 caracteres, com letras, números e um símbolo.</small>
            <small class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></small>

            <label for="confirmacaoSenha">Confirme a senha</label>
            <input type="password" id="confirmacaoSenha" th:field="*{confirmacaoSenha}" autocomplete="new-password"
                   maxlength="64" required th:errorclass="campo-invalido">
            <small class="erro-campo" th:if="${#fields.hasErrors('confirmacaoSenha')}"
                   th:errors="*{confirmacaoSenha}"></small>
            <small class="erro-campo" th:if="${#fields.hasErrors('senhaConfirmada')}"
                   th:errors="*{senhaConfirmada}"></small>

            <button type="submit" class="botao botao-bloco">Criar conta</button>
        </form>

        <p class="rodape-formulario">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </div>
</section>
</body>
</html>
