spring.application.name=barbearia
spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:barbearia}
spring.data.mongodb.auto-index-creation=true

server.port=${PORT:8080}
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SEGURO:false}
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

barbearia.admin.email=${ADMIN_EMAIL:}
barbearia.admin.senha=${ADMIN_SENHA:}

barbearia.tema.nome=${TEMA_NOME:classico}
barbearia.tema.layout=${TEMA_LAYOUT:padrao}
barbearia.tema.nome-barbearia=${BARBEARIA_NOME:Barbearia}
barbearia.tema.slogan=${BARBEARIA_SLOGAN:Tradi\u00e7\u00e3o e estilo desde 1998}
